<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luminate — Logo reveal</title>
<style>
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 700;src:url(../../assets/fonts/schibsted-grotesk.woff2) format('woff2')}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:500;src:url(../../assets/fonts/unbounded-500.woff2) format('woff2')}
@font-face{font-family:'Unbounded';font-style:normal;font-weight:600;src:url(../../assets/fonts/unbounded-600.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#F6F3F1;color:#1C1316;font-family:'Schibsted Grotesk',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
canvas{display:block;max-width:94vw;max-height:80vh;border-radius:12px;box-shadow:0 1px 2px rgba(17,17,17,.06),0 12px 24px -12px rgba(17,17,17,.22)}
.ui{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ui button{font:600 14px/1 'Schibsted Grotesk',sans-serif;color:#1C1316;background:#fff;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);border-radius:12px;padding:11px 16px;cursor:pointer}
.ui button.on{background:#1C1316;color:#fff;box-shadow:none}
body.export{display:block;background:#fff}
body.export .ui{display:none}
body.export canvas{max-width:none;max-height:none;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui">
  <button data-theme="white">Vit</button>
  <button data-theme="pink">Rosa</button>
</div>
<div class="ui">
  <button data-f="9x16">9:16</button>
  <button data-f="4x5">4:5</button>
  <button data-f="1x1">1:1</button>
  <button data-f="16x9">16:9</button>
  <button id="replay">Spela igen</button>
</div>
<script>
/* ------------------------------------------------------------------
   Luminate Media — logo reveal (samma formspråk som luminatemedia.se)
   1. LM-konturen ritas fram   2. fylls i underifrån
   3. loggan glider åt vänster och "Luminate" kommer fram bredvid
   4. luminatemedia.se tonar in
   Deterministisk: render(t) ger samma bild för samma t (används vid export).
------------------------------------------------------------------- */
const D_L = "M62 2174 l3 -2119 1230 -2 c677 -2 1243 1 1259 5 29 8 29 8 -140 183 -93 96 -232 240 -309 320 l-140 147 -655 1 -655 0 -3 1499 -2 1500 -291 288 c-159 159 -292 291 -295 293 -2 2 -3 -949 -2 -2115z";
const D_M = "M3694 2953 c-136 -142 -386 -400 -554 -573 -168 -173 -387 -399 -485 -502 -98 -104 -182 -188 -185 -188 -4 0 -42 37 -86 83 -517 538 -911 945 -1141 1177 l-243 245 0 -459 0 -458 88 -92 c48 -51 247 -261 442 -467 315 -331 791 -834 891 -941 49 -53 20 -76 400 329 189 202 390 414 446 472 l102 106 1 -811 0 -812 23 -6 c12 -3 142 -6 290 -6 l267 0 0 1580 c0 869 -2 1580 -4 1580 -2 0 -115 -116 -252 -257z";
const P_L = new Path2D(D_L), P_M = new Path2D(D_M);

const THEMES = {
  // vit bakgrund, rosa logga, mörk text — som sajten
  white: { bg:'#FFFFFF', stroke:'#E7929C', fill:'#E7929C', name:'#E7929C', url:'#E7929C' },
  // rosa bakgrund, vitt — som profilbilden
  pink:  { bg:'#E7929C', stroke:'#FFFFFF', fill:'#FFFFFF', name:'#FFFFFF', url:'#FFFFFF' },
};
const FORMATS = {'9x16':[1080,1920],'4x5':[1080,1350],'1x1':[1080,1080],'16x9':[1920,1080]};
const FPS = 60, DUR = 5.0;
const INTRO_H = 0.36;      // loggans höjd under framritningen (andel av u)
const NAME = 'LUMINATE', NAME_FONT = '600 {px} "Unbounded"', NAME_TRACK = 0.06;
const URL_FONT = '500 {px} "Unbounded"', URL_TRACK = 0.04;
// loggans geometri i den 400x435 stora logo-boxen (y nedåt, centrum 200/217.5)
const G = { left:5.9, right:394.6, bottom:429.7, mTop:114 };

// Tidslinje (sekunder)
const T = {
  drawL:[0.25,1.45], drawM:[0.4,1.6],
  fill:[1.35,2.05], strokeOut:[1.9,2.2],
  slide:[2.2,3.1], name:[2.55,3.35],
  url:[3.0,3.65],
};

/* ---------- utils ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,[a,b])=>clamp((t-a)/(b-a));
// cubic-bezier som i CSS (sajtens --ease är .16,1,.3,1)
function bezier(x1,y1,x2,y2){
  const A=(a,b)=>1-3*b+3*a, B=(a,b)=>3*b-6*a, C=a=>3*a;
  const f=(t,a,b)=>((A(a,b)*t+B(a,b))*t+C(a))*t, df=(t,a,b)=>3*A(a,b)*t*t+2*B(a,b)*t+C(a);
  return x=>{ if(x<=0) return 0; if(x>=1) return 1; let t=x;
    for(let i=0;i<8;i++){const d=df(t,x1,x2); if(Math.abs(d)<1e-6) break; t-=(f(t,x1,x2)-x)/d;}
    return f(clamp(t),y1,y2); };
}
const easeSite=bezier(.16,1,.3,1);   // snabbt in, mjukt landande
const easeInOut=bezier(.65,0,.35,1);
const easeDraw=bezier(.45,0,.2,1);

function pathLen(d){
  const NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg'), p=document.createElementNS(NS,'path');
  p.setAttribute('d',d); s.appendChild(p);
  s.style.cssText='position:absolute;width:0;height:0;visibility:hidden';
  document.body.appendChild(s); const L=p.getTotalLength(); s.remove(); return L;
}
const LEN_L=pathLen(D_L), LEN_M=pathLen(D_M);

/* ---------- state ---------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W,H,u,fmt,theme=THEMES.white,themeName='white',lay=null;

function setFormat(f){ fmt=FORMATS[f]?f:'9x16'; [W,H]=FORMATS[fmt]; u=Math.min(W,H); cv.width=W; cv.height=H; lay=null; markUI(); }
function setTheme(n){ themeName=THEMES[n]?n:'white'; theme=THEMES[themeName]; markUI(); }
function markUI(){
  document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===fmt));
  document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===themeName));
}

// Lockup: [logga] [LUMINATE]. Versalernas höjd = M:ets höjd och baslinjen = loggans botten,
// så texten linjerar exakt med märket (L:et sticker upp som en "ascender").
function font(tpl,px){ return tpl.replace('{px}',px+'px'); }
function layout(){
  if(lay) return lay;
  const total=Math.min(0.82*W,1.05*u);                 // lockupens bredd
  ctx.font=font(NAME_FONT,100); ctx.letterSpacing=`${NAME_TRACK*100}px`;
  const m=ctx.measureText(NAME); ctx.letterSpacing='0px';
  const cap100=m.actualBoundingBoxAscent, w100=m.width-NAME_TRACK*100;   // utan efterhängande spärrning
  const capK=(G.bottom-G.mTop)/435;                    // versalhöjd / logo-boxens höjd
  const logoWK=(G.right-G.left)/435, gapK=0.27;
  const textWK=w100*capK/cap100;                       // textbredd / logo-boxens höjd
  const Lh=total/(logoWK+gapK+textWK);
  const fs=capK*Lh/cap100*100, nameW=textWK*Lh;
  const cy=H/2-0.02*u;
  const left=W/2-total/2;
  const logoEndX=left+(200-G.left)/435*Lh;
  const capH=capK*Lh;
  lay={Lh,fs,nameW,cy,capH,gap:gapK*Lh,
    logoStartX:W/2, logoEndX,
    nameX:left+logoWK*Lh+gapK*Lh, nameBase:cy+(G.bottom-217.5)/435*Lh,
    urlFs:Math.max(0.03*u,0.3*capH), urlY:cy+(G.bottom-217.5)/435*Lh+Math.max(0.085*u,0.75*capH)};
  return lay;
}

function logoMatrix(x,y,h){
  const s=h/435;
  return new DOMMatrix().translate(x,y).scale(s,s).translate(-200,-217.5).translate(0,435).scale(0.1,-0.1);
}

/* ---------- render ---------- */
function render(t){
  const c=ctx, L=layout();
  c.setTransform(1,0,0,1,0,0); c.globalAlpha=1; c.globalCompositeOperation='source-over';
  c.fillStyle=theme.bg; c.fillRect(0,0,W,H);

  // hela kompositionen andas långsamt (1.00 -> 1.025)
  const breathe=1+0.025*easeInOut(clamp(t/DUR));
  const cam=new DOMMatrix().translate(W/2,L.cy).scale(breathe).translate(-W/2,-L.cy);

  const ps=easeInOut(prog(t,T.slide));
  const lx=lerp(L.logoStartX,L.logoEndX,ps);
  const lh=lerp(Math.max(INTRO_H*u,L.Lh),L.Lh,ps);   // stor i mitten -> lockup-storlek
  const M=cam.multiply(logoMatrix(lx,L.cy,lh));
  const k=lh/435*0.1;                       // px per path-enhet

  // 1) konturen ritas fram
  const sOut=1-prog(t,T.strokeOut);
  if(sOut>0){
    c.save(); c.setTransform(M);
    c.lineWidth=Math.max(2,0.0042*u)/k; c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle=theme.stroke; c.globalAlpha=sOut;
    const dl=easeDraw(prog(t,T.drawL)), dm=easeDraw(prog(t,T.drawM));
    if(dl>0){c.setLineDash([LEN_L*dl,LEN_L+10]); c.stroke(P_L);}
    if(dm>0){c.setLineDash([LEN_M*dm,LEN_M+10]); c.stroke(P_M);}
    c.restore();
  }

  // 2) fyllning stiger underifrån (L först, M strax efter)
  const pf=prog(t,T.fill);
  if(pf>0){
    const top=cam.transformPoint(new DOMPoint(lx,L.cy-lh/2)).y, bot=cam.transformPoint(new DOMPoint(lx,L.cy+lh/2)).y;
    [[P_L,0],[P_M,0.12]].forEach(([P,delay])=>{
      const e=easeInOut(clamp((pf-delay)/(1-0.12)));
      if(e<=0) return;
      const y=lerp(bot+2,top-2,e);
      c.save(); c.setTransform(1,0,0,1,0,0); c.beginPath(); c.rect(0,y,W,H-y); c.clip();
      c.setTransform(M); c.fillStyle=theme.fill; c.fill(P); c.restore();
    });
  }

  // 3) "Luminate" glider fram bakom loggan
  const pn=prog(t,T.name);
  if(pn>0){
    const e=easeSite(pn);
    const logoRight=lx+(G.right-200)/435*lh;
    c.save(); c.setTransform(cam);
    c.beginPath(); c.rect(logoRight+L.gap*0.3,0,W,H); c.clip();
    c.font=font(NAME_FONT,L.fs); c.letterSpacing=`${NAME_TRACK*L.fs}px`;
    c.fillStyle=theme.name; c.textBaseline='alphabetic';
    c.globalAlpha=clamp(pn*2.2);
    c.fillText(NAME, L.nameX - (1-e)*L.nameW*0.28, L.nameBase);
    c.restore();
  }

  // 4) hemsidan
  const pu=prog(t,T.url);
  if(pu>0){
    const e=easeSite(pu);
    c.save(); c.setTransform(cam);
    c.font=font(URL_FONT,L.urlFs); c.letterSpacing=`${URL_TRACK*L.urlFs}px`;
    c.textAlign='center'; c.fillStyle=theme.url; c.globalAlpha=e;
    c.fillText('luminatemedia.se', W/2 + URL_TRACK*L.urlFs/2, L.urlY + (1-e)*0.02*u);
    c.restore();
  }
}

/* ---------- start ---------- */
const params=new URLSearchParams(location.search);
const isExport=params.has('export');
if(isExport) document.body.classList.add('export');
setTheme(params.get('theme')||'white');
setFormat(params.get('f')||'9x16');

window.ready=Promise.all([document.fonts.load(font(NAME_FONT,100)),document.fonts.load(font(URL_FONT,100))]).then(()=>document.fonts.ready).then(()=>{lay=null;});
window.DUR=DUR; window.FPS=FPS; window.renderFrame=render;
window.frameDataURL=(t,type='image/png',q)=>{render(t);return cv.toDataURL(type,q);};

if(!isExport){
  let start=performance.now();
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{setFormat(b.dataset.f);start=performance.now();});
  document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.theme);start=performance.now();});
  document.getElementById('replay').onclick=()=>start=performance.now();
  window.ready.then(()=>{
    const loop=now=>{const t=(now-start)/1000; render(Math.min(t,DUR)); if(t>DUR+1.5) start=now; requestAnimationFrame(loop);};
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
